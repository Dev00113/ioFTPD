###############################################################################
# ioFTPD Network Mounts Configuration
# Deployed to: etc\netmounts.cfg
#
# PURPOSE
#   This file is OPTIONAL.  ioFTPD automatically monitors the health of every
#   UNC path (\\server\share\...) found in any .vfs file — no entry here is
#   needed for that to work.
#
#   This file is only required when a share needs explicit credentials
#   (username + password) that differ from the Windows account ioFTPD runs as.
#   In a domain environment where the file server grants access to the service
#   account or machine account, this file can remain empty or absent.
#
# FORMAT
#   Each line defines one network share root and its credentials:
#
#     <\\server\share>  [username]  [password]  [domain]
#
#   - The UNC share root is required; username/password/domain are optional.
#   - Fields with spaces MUST be surrounded by double-quotes: "my password"
#   - Use "" (empty quotes) for an explicit blank password (guest accounts).
#   - Lines beginning with # are comments.
#   - Forward slashes are accepted and normalised: //server/share works too.
#   - Trailing slashes are stripped automatically.
#   - Matching against .vfs paths is case-insensitive.
#
# EXAMPLES
#
#   # NAS with username and password
#   \\nas.local\media          ftpuser        "my s3cr3t"
#
#   # Share with spaces in the share name or password
#   "\\file server\share name"  "domain user"  "pass word"  CORP
#
#   # Workgroup NAS with explicit domain
#   \\backup-server\archive    svcacct        P@ssw0rd    WORKGROUP
#
#   # Guest access with blank password (older SMB/Samba configurations)
#   \\oldnas\public            guest          ""
#
#   # Domain-accessible share — monitoring only, no credentials needed here
#   # (leave this line commented out or omit entirely; Windows handles auth)
#   # \\fileserver\data
#
# SECURITY
#   Passwords are stored in cleartext.  Restrict access to this file:
#     - SYSTEM: Full Control
#     - Administrators: Full Control
#     - All other users: No Access
#
# SESSION 0 NOTE
#   ioFTPD runs as a Windows service (Session 0).  Drive-letter mappings made
#   by an interactive user (Z:\...) are NOT visible in Session 0.  Use UNC
#   paths (\\server\share\...) directly in your .vfs files for network shares.
#   Local drives (C:\, D:\, etc.) are always accessible and unaffected.
#
# SMB VERSION COMPATIBILITY
#   Windows negotiates the highest mutually supported SMB version automatically.
#   Modern NAS devices (Synology, QNAP, TrueNAS, UnRAID) use Samba 4.x (SMBv3).
#   Windows Server 2016+ disables SMBv1 by default; very old NAS firmware that
#   only supports SMBv1 will fail to connect.  Upgrade the NAS firmware or
#   enable SMBv1 via "Turn Windows features on or off" (not recommended).
#
###############################################################################

# Add your network mount entries below:
#
# \\nas.local\media            ftpuser    "my s3cr3t"
# \\backup-server\archive      svcacct    P@ssw0rd    WORKGROUP
